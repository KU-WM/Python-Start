<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 성격 유형 검사</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        #app {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        #progress-bar-container {
            width: 100%;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            height: 20px;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #007bff;
            transition: width 0.3s ease;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #answers label {
            display: block;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="main-page">
            <h1>MBTI 성격 유형 검사</h1>
            <button id="start-button">검사 시작</button>
        </div>
        <div id="test-page" style="display:none;">
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <h2>질문 <span id="question-number"></span>/10</h2>
            <p id="question-text"></p>
            <div id="answers">
                <label><input type="radio" name="answer" value="1"> 1</label>
                <label><input type="radio" name="answer" value="2"> 2</label>
                <label><input type="radio" name="answer" value="3"> 3</label>
                <label><input type="radio" name="answer" value="4"> 4</label>
                <label><input type="radio" name="answer" value="5"> 5</label>
            </div>
            <button id="next-button">다음</button>
        </div>
        <div id="result-page" style="display:none;">
            <h2>결과</h2>
            <p id="result-text"></p>
            <p id="job-recommendations"></p>
            <button id="retry-button">다시 하기</button>
        </div>
    </div>
    <script>
        const questions = [
            { text: "나는 사교적이고 외향적인 성격이다.", category: "E/I" },
            { text: "나는 고정관념보다는 새로운 가능성에 관심이 많다.", category: "N/S" },
            { text: "나는 논리적이고 객관적으로 판단한다.", category: "T/F" },
            { text: "나는 체계적이고 계획적인 삶을 선호한다.", category: "P/J" },
            { text: "나는 혼자 있는 시간이 더 편하다.", category: "E/I" },
            { text: "나는 세부 사항보다는 전체적인 그림에 집중한다.", category: "N/S" },
            { text: "나는 감정을 기준으로 결정을 내리는 편이다.", category: "T/F" },
            { text: "나는 즉흥적으로 행동하는 경우가 많다.", category: "P/J" },
            { text: "나는 많은 사람들과 함께 있을 때 에너지를 얻는다.", category: "E/I" },
            { text: "나는 현실적이고 실질적인 정보를 선호한다.", category: "N/S" }
        ];

        const jobRecommendations = {
            ENTJ: ["경영자", "프로젝트 매니저", "컨설턴트", "정책 분석가"],
            ENTP: ["창업가", "광고 기획자", "PR 전문가", "혁신 기술 개발자"],
            ENFJ: ["교육자", "사회복지사", "기업 코치", "홍보 전문가"],
            ENFP: ["마케터", "예술가", "사업가", "이벤트 플래너"],
            INTJ: ["연구원", "데이터 과학자", "전략 기획자", "엔지니어"],
            INTP: ["철학자", "소프트웨어 엔지니어", "과학자", "데이터 분석가"],
            INFJ: ["작가", "상담사", "종교 지도자", "심리학자"],
            INFP: ["예술가", "상담가", "사회활동가", "작가"],
            ESTJ: ["관리자", "공무원", "회계사", "군인"],
            ESTP: ["영업 담당자", "구조 전문가", "운동 선수", "비즈니스 개발자"],
            ESFJ: ["교사", "간호사", "인사 관리자", "이벤트 코디네이터"],
            ESFP: ["연예인", "레스토랑 경영자", "여행 가이드", "홍보 전문가"],
            ISTJ: ["회계사", "법률 전문가", "공무원", "데이터 분석가"],
            ISTP: ["기술자", "소방관", "운송 전문가", "자동차 정비사"],
            ISFJ: ["간호사", "사회복지사", "초등교사", "사서"],
            ISFP: ["패션 디자이너", "그래픽 디자이너", "물리치료사", "작가"]
        };

        const scores = { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, P: 0, J: 0 };
        let currentQuestion = 0;

        document.getElementById("start-button").addEventListener("click", () => {
            document.getElementById("main-page").style.display = "none";
            document.getElementById("test-page").style.display = "block";
            loadQuestion();
        });

        document.getElementById("next-button").addEventListener("click", () => {
            const answer = document.querySelector('input[name="answer"]:checked');
            if (answer) {
                const score = parseInt(answer.value);
                const category = questions[currentQuestion].category;
                if (category === "E/I") {
                    scores.E += score;
                    scores.I += 6 - score;
                } else if (category === "N/S") {
                    scores.N += score;
                    scores.S += 6 - score;
                } else if (category === "T/F") {
                    scores.T += score;
                    scores.F += 6 - score;
                } else if (category === "P/J") {
                    scores.P += score;
                    scores.J += 6 - score;
                }
                currentQuestion++;
                updateProgressBar();
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            } else {
                alert("답변을 선택해주세요!");
            }
        });

        document.getElementById("retry-button").addEventListener("click", () => {
            currentQuestion = 0;
            for (let key in scores) scores[key] = 0;
            document.getElementById("result-page").style.display = "none";
            document.getElementById("main-page").style.display = "block";
            updateProgressBar(); // 초기화
        });

        function loadQuestion() {
            document.getElementById("question-number").innerText = currentQuestion + 1;
            document.getElementById("question-text").innerText = questions[currentQuestion].text;
            document.querySelectorAll('input[name="answer"]').forEach(input => input.checked = false);
        }

        function showResult() {
            const resultType = (scores.E > scores.I ? "E" : "I") +
                               (scores.N > scores.S ? "N" : "S") +
                               (scores.T > scores.F ? "T" : "F") +
                               (scores.P > scores.J ? "P" : "J");
            const jobs = jobRecommendations[resultType] || ["직업 추천 정보를 찾을 수 없습니다."];
            document.getElementById("test-page").style.display = "none";
            document.getElementById("result-page").style.display = "block";
            document.getElementById("result-text").innerText = 
                `당신의 성격 유형은 ${resultType}입니다.`;
            document.getElementById("job-recommendations").innerText = 
                `추천 직업: ${jobs.join(", ")}`;
        }

        function updateProgressBar() {
            const progress = ((currentQuestion / questions.length) * 100).toFixed(2);
            document.getElementById("progress-bar").style.width = `${progress}%`;
        }

        // 초기 상태 바 초기화
        updateProgressBar();
    </script>
</body>
</html>
